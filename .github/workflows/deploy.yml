name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci || npm install
      - name: Validate Environment
        run: node scripts/env-check.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_NUDGE_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_NUDGE_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_MENTOR_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_MENTOR_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PROTOCOL_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_PROTOCOL_TEMPLATE_ID }}
      - name: Run Smoke Tests
        run: npx playwright install --with-deps chromium && npm run test:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_NUDGE_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_NUDGE_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_MENTOR_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_MENTOR_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PROTOCOL_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_PROTOCOL_TEMPLATE_ID }}
      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PRIVATE_SKIP_ESLINT: true
          NEXT_PRIVATE_SKIP_TYPESCRIPT: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_NUDGE_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_NUDGE_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_MENTOR_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_MENTOR_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PROTOCOL_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_PROTOCOL_TEMPLATE_ID }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
